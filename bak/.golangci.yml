# .golangci.yml — Frontiir R&D Standard (v2.0)
# Requires golangci-lint v2.x
# Teams: Kore, DevBizSys, OSS, DevERP

version: "2"

run:
  timeout: 5m

linters:
  default: none   # standard preset disable
  enable:
    # --- Core (must-have) ---
    - errcheck       # unchecked errors
    - govet          # suspicious constructs
    - staticcheck    # comprehensive static analysis
    - ineffassign    # ineffectual assignments

    # --- Style & consistency ---
    - misspell       # common typos (auto-fixable)
    - revive         # extensible linter replacing golint

    # --- Bugs & reliability ---
    - gosec          # security issues
    - bodyclose      # HTTP response body leaks
    - nilerr         # returning nil on error

    # --- Complexity ---
    - gocyclo        # cyclomatic complexity
    - funlen         # function length
    - nestif         # deeply nested ifs

  settings:
    gocyclo:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
    nestif:
      min-complexity: 5
    revive:
      rules:
        - name: exported
          disabled: true # too noisy for existing codebases
        - name: unused-parameter
          severity: warning
        - name: cognitive-complexity
          arguments: [20]
    gosec:
      excludes:
        - G104 # unhandled errors (errcheck covers this)
    misspell:
      locale: US

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
    paths:
      - vendor
      - third_party
      - mocks

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
